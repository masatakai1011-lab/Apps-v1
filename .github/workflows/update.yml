name: ボードを最新にする

on:
  schedule:
    # GitHub の時計は日本より9時間遅い。混み合う0分ちょうどを避けて5分・35分に動かす
    # 平日 日本時間 6:05 / 8:05（前の夜の結果と、東京の市場が開く前）
    - cron: "5 21,23 * * 0-4"
    # 平日 日本時間 9:05 / 10:05 / 12:05 と、15:05〜翌2:05 は毎時（ロンドン・ニューヨークの時間）
    - cron: "5 0,1,3,6-17 * * 1-5"
    # 平日 日本時間 21:35〜翌0:35 は30分ごと（1日で一番よく動く時間）
    - cron: "35 12-15 * * 1-5"
    # 土日 日本時間 9:05 / 15:05 / 21:05（ニュースと世界情勢のため）
    - cron: "5 0,6,12 * * 0,6"
  push:
    paths:
      - watchlist.txt
      - scripts/update.py
      - .github/workflows/update.yml
  workflow_dispatch:
    inputs:
      test_alert:
        description: "お知らせのテストを送る"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: update-board
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update.py
      - name: 結果を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet && exit 0
          git commit -m "ボードのデータを更新"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
      - name: 大きな動きをお知らせ
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: python scripts/notify.py
